<mat-toolbar>
  <span>Healthcare Case</span>
</mat-toolbar>
<div class="map-card-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Hospital Layout</mat-card-title>
    </mat-card-header>
    <mat-card-actions>
      <div class="map-container">
        <app-map [state]="state"></app-map>
      </div>
    </mat-card-actions>
  </mat-card>
</div>

<button matButton (click)="startMission()">start</button>
<div class="tabs-container">
  <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
    <mat-tab label="Agent Position">
      <ul>
        @for (agentName of agents; track agentName) {
          <li>{{ agentName }} ({{ state?.pos[agentName] }})</li>
        } @empty {
          <li>No items found.</li>
        }
      </ul>
    </mat-tab>
      @if(coordinator) {
        <mat-tab label="Missões">
            <app-missions [missions]="coordinator.missions"></app-missions>
        </mat-tab>
        <mat-tab label="Robos">
            <app-robots [robots]="coordinator.robots" [agentsData]="agentsData"></app-robots>
        </mat-tab>
      }
  </mat-tab-group>
</div>
